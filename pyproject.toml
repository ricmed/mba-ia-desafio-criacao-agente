[project]
name = "aurora-assistente"
version = "1.0.0"
description = "Assistente virtual do Residencial Aurora: agentes Google ADK expostos por uma API FastAPI, com as regras do condominio garantidas em codigo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.9.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
aurora = "aurora.cli:subir_api"
restaurar-dados = "aurora.cli:restaurar_dados"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
